[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Reverse Proxy all /api/* calls to your live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://sales-intelligence-rflg.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
