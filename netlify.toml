# Netlify Configuration for Sales Intelligence Dashboard

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Redirect API calls to the deployed backend (e.g. on Render/Railway/Fly.io)
# You can set the BACKEND_URL environment variable in Netlify Site Settings > Environment Variables
[[redirects]]
  from = "/api/*"
  to = "https://sales-intelligence-api.onrender.com/api/:splat"
  status = 200
  force = false

# Single Page Application (SPA) redirect rule:
# Ensures refreshing or deep linking on pages works without 404s
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
